<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 方向 B「声音落成光标」：几道声波，最后一道变成打字的光标 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2133"/>
      <stop offset="1" stop-color="#2b2458"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="232" y1="320" x2="660" y2="700">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset="0.55" stop-color="#ff3d6e"/>
      <stop offset="1" stop-color="#b14dff"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <g fill="url(#wave)">
    <rect x="232" y="452" width="56" height="120" rx="28"/>
    <rect x="324" y="382" width="56" height="260" rx="28"/>
    <rect x="416" y="322" width="56" height="380" rx="28"/>
    <rect x="508" y="402" width="56" height="220" rx="28"/>
    <rect x="600" y="462" width="56" height="100" rx="28"/>
  </g>
  <g fill="#fff">
    <rect x="726" y="322" width="36" height="380" rx="18"/>
    <rect x="684" y="322" width="120" height="34" rx="17"/>
    <rect x="684" y="668" width="120" height="34" rx="17"/>
  </g>
</svg>
