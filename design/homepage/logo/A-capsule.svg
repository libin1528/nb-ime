<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 方向 A「玻璃胶囊」：图标就是录音胶囊本身 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset="0.5" stop-color="#ff3d6e"/>
      <stop offset="1" stop-color="#6a4dff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a4e"/>
      <stop offset="1" stop-color="#e8262f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5a1640" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <rect x="176" y="392" width="672" height="240" rx="120" fill="url(#glass)"/>
  </g>
  <rect x="177.5" y="393.5" width="669" height="237" rx="118.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <circle cx="296" cy="512" r="88" fill="url(#dot)"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="11">
    <rect x="276" y="452" width="40" height="72" rx="20" fill="#fff" stroke="none"/>
    <path d="M261 504a35 35 0 0 0 70 0"/>
    <path d="M296 540v18M280 560h32"/>
  </g>
  <g fill="#fff">
    <rect x="428" y="482" width="22" height="60" rx="11"/>
    <rect x="474" y="457" width="22" height="110" rx="11"/>
    <rect x="520" y="472" width="22" height="80" rx="11"/>
    <rect x="566" y="437" width="22" height="150" rx="11"/>
    <rect x="612" y="464" width="22" height="96" rx="11"/>
    <rect x="658" y="450" width="22" height="124" rx="11"/>
    <rect x="704" y="477" width="22" height="70" rx="11"/>
    <rect x="750" y="492" width="22" height="40" rx="11" opacity="0.7"/>
  </g>
</svg>
